<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Career Catalyst</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader-overlay">
        <div class="spinner"></div>
    </div>

    <nav class="navbar">
        <div class="logo">
            <img src="https://img.icons8.com/color/48/m.png" alt="M" style="width: 32px; height: 32px;">
            <span>Catalyst</span>
        </div>
        <div class="nav-links">
            <a href="login.html">Home</a>
            <a href="home.html" class="btn-nav-action">Get Started</a>
        </div>
    </nav>

    <main class="hero-section" style="justify-content: center; min-height: calc(100vh - 80px);">
        <div class="glass-panel reveal" style="max-width: 450px; padding: 40px;">
            <div class="panel-header" style="margin-bottom: 30px; text-align: center;">
                <h2 style="font-size: 32px; color: var(--text-primary);">Welcome Back</h2>
                <p style="color: var(--text-secondary);">Access your professional intelligence dashboard.</p>
            </div>

            <form id="loginForm" action="home.html" style="display: grid; gap: 20px;">
                <div class="field-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@domain.com">
                </div>
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn-premium" style="width: 100%;">
                    Sign In to Portal
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px;">
                <p style="color: var(--text-secondary); font-size: 14px;">
                    New to Catalyst? <a href="#" style="color: var(--accent-gold); font-weight: 600;">Request Access</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('load', () => {
                const loader = document.getElementById('loader-overlay');
                gsap.to(loader, {
                    opacity: 0,
                    duration: 0.8,
                    onComplete: () => {
                        loader.style.display = 'none';
                        gsap.to('.reveal', { opacity: 1, y: 0, duration: 1, ease: "expo.out" });
                    }
                });
            });
        });
    </script>
</body>
</html>
